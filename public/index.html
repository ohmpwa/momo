<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff8fab">
<title>Momo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#fff6e9;--card:#fff;--pink:#ff8fab;--yellow:#ffd166;--green:#06d6a0;--blue:#4cc9f0;--purple:#b388ff;--ink:#5a3e36}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
h1{margin:0;font-size:2rem;color:var(--pink)}
.stars{font-size:1.4rem;background:var(--card);padding:6px 14px;border-radius:20px;box-shadow:0 3px 0 #0001}
main{width:100%;max-width:760px;padding:0 16px 24px;flex:1}
.momo{font-size:5rem;text-align:center;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.say{text-align:center;font-size:1.3rem;margin:4px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.btn{border:0;border-radius:24px;padding:18px 10px;font:inherit;font-size:1.2rem;color:var(--ink);background:var(--card);box-shadow:0 6px 0 #0002;cursor:pointer;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0002}
.btn .e{font-size:3rem;display:block}
.btn.locked{opacity:.45}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.row .btn{padding:10px 18px}
.on{background:var(--yellow)!important}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:10px}
.choices.c3{grid-template-columns:repeat(3,1fr)}
.choices .btn .e{font-size:4rem}
.prompt{font-size:2rem;text-align:center;margin:10px 0}
.big{font-size:5.5rem;text-align:center;line-height:1.1}
.shadow{filter:brightness(0);opacity:.75}
.ok{background:var(--green)!important;color:#fff}
.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.back{background:var(--blue);color:#fff;padding:10px 16px}
.mem .btn{min-height:84px;font-size:2.3rem;padding:6px}
.mem .hid{background:var(--pink);color:transparent}
.pop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:8rem;pointer-events:none;animation:pop 1s forwards;z-index:9}
@keyframes pop{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}
.note{font-size:.9rem;opacity:.7;text-align:center;margin-top:20px}
.sky{position:relative;height:58vh;border-radius:24px;background:linear-gradient(#bde0fe,#e7f6ff);overflow:hidden}
.balloon{position:absolute;bottom:-120px;font-size:3.4rem;background:none;border:0;cursor:pointer;animation:rise linear forwards;padding:0}
.balloon::after{content:"";display:block;width:2px;height:30px;background:#9998;margin:-6px auto 0}
@keyframes rise{to{transform:translateY(calc(-58vh - 140px))}}
.lvl{position:relative;padding:14px 8px}
.lvl .n{position:absolute;top:8px;left:12px;font-size:.9rem;opacity:.6}
.lvl small{display:block;margin-top:4px}
.seq{display:flex;gap:8px;justify-content:center;min-height:64px;font-size:2.6rem}
.age .btn{padding:22px 10px}
.age .btn .e{font-size:3.6rem}
.flag{width:34px;height:22px;border-radius:4px;vertical-align:middle;box-shadow:0 0 0 1px #0002}
.langs .btn{display:flex;align-items:center;gap:8px}
.langs.bigflags .btn{flex-direction:column;padding:12px 10px;flex:1;max-width:120px}
.langs.bigflags .flag{width:56px;height:37px}
.word{font-size:1.5rem}
</style>
</head>
<body>
<header><h1><span id="hpet">🐰</span> Momo</h1><div class="stars">⭐ <span id="stars">0</span></div></header>
<main id="app"></main>
<script src="data.js"></script>
<script>
// ---------- State ----------
const S={stars:0,spent:0,stickers:[],stats:{},done:{},lang:"",hat:"",age:0,pet:""};
try{Object.assign(S,JSON.parse(localStorage.getItem("momo")||"{}"))}catch(e){}
const $=q=>document.querySelector(q), app=$("#app");
const pet=()=>PETS.find(p=>p.id===S.pet)||PETS[0];
const petName=()=>pet().n[S.lang]||pet().n.en;
const save=()=>{try{localStorage.setItem("momo",JSON.stringify(S))}catch(e){};$("#stars").textContent=S.stars-S.spent;$("#hpet").textContent=pet().e;document.documentElement.lang=S.lang||"th"};
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function track(w,ok){const k=w[1],t=S.stats[k]||(S.stats[k]={ok:0,bad:0});ok?t.ok++:t.bad++;save()}
const allWords=()=>Object.values(V).flat();
let timers=[];const later=(f,ms)=>timers.push(setTimeout(f,ms));
const every=(f,ms)=>timers.push(setInterval(f,ms));
const clearTimers=()=>{timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[]};

// ---------- Language helpers: menus follow the language being practised ----------
const L_=()=>S.lang||"th";
const t=(k,...a)=>{const v=UI[L_()][k]??UI.en[k];return typeof v==="function"?v(...a):v};
const say=k=>SAY[L_()][k];
const setName=k=>SETNAME[L_()][k];
const gameName=g=>GAMES[g].t[L_()];
const word=w=>wordIn(w,L_());
const label=w=>S.lang==="zh"?`${w[2]}<br><small>${w[3]}</small>`:word(w);
function langButtons(cls=""){
  return `<div class="row langs ${cls}">${LANGS.map(l=>`<button class="btn ${S.lang===l?"on":""}" data-l="${l}">${FLAGS[l]}<span>${LANG_NAME[l]}</span></button>`).join("")}</div>`;
}
function wireLangs(after){app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save();after()})}

// ---------- Voice ----------
const LC={zh:"zh-CN",th:"th-TH",en:"en-US"};
// Browser-voice fallback: prefer natural/neural voices
const VOICE_HINTS={
  en:[/natural/i,/neural/i,/premium|enhanced/i,/google us english/i,/aria|jenny|ana|samantha|ava|allison|susan|zira/i],
  zh:[/natural/i,/neural/i,/premium|enhanced/i,/xiaoxiao|xiaoyi|xiaohan|tingting|meijia|huihui|yaoyao/i,/google.*(普通话|mandarin)/i],
  th:[/natural/i,/neural/i,/premwadee|achara|kanya|pattara/i,/google.*ไทย|thai/i],
};
const voiceCache={};
function bestVoice(lang){
  if(voiceCache[lang]!==undefined)return voiceCache[lang];
  const all=speechSynthesis.getVoices(), code=LC[lang], base=code.slice(0,2);
  const cands=all.filter(v=>v.lang.replace("_","-").toLowerCase().startsWith(base)&&!/hk|tw|yue/i.test(lang==="zh"?v.lang+v.name:""));
  if(!cands.length)return null;   // voices not loaded yet: don't cache
  const score=v=>VOICE_HINTS[lang].reduce((s,re,i)=>s+(re.test(v.name)?10-i:0),0)+(v.lang.replace("_","-")===code?2:0)+(/female|girl/i.test(v.name)?1:0)-(/male\b|david|mark|guy|kangkang|yunyang/i.test(v.name)?3:0);
  return voiceCache[lang]=cands.sort((a,b)=>score(b)-score(a))[0];
}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{for(const k in voiceCache)delete voiceCache[k]};
// Pre-recorded neural voice clips (tools/gen-audio.mjs) — natural, child-friendly.
let CLIPS={};
fetch("audio/index.json").then(r=>r.ok?r.json():{}).then(j=>CLIPS=j).catch(()=>{});
const player=new Audio();let clipQueue=[];
player.onended=()=>{const n=clipQueue.shift();if(n){player.src=n;player.play().catch(()=>{})}};
function stopVoice(){clipQueue=[];player.pause();window.speechSynthesis?.cancel()}
let speakTimer;
function speak(text,lang=L_(),keep){
  if(S.mute||!text)return;
  const clip=CLIPS[`${lang}|${text}`];
  if(clip){
    const src="audio/"+clip;
    if(keep&&!player.paused&&!player.ended){clipQueue.push(src);return}   // queue (parrot game)
    if(!keep)stopVoice();
    player.src=src;player.play().catch(()=>{});return;
  }
  if(!window.speechSynthesis)return;
  if(location.protocol.startsWith("http")&&Object.keys(CLIPS).length)console.warn("no clip for",lang,text);
  const go=()=>{
    const u=new SpeechSynthesisUtterance(String(text)), v=bestVoice(lang);
    u.lang=LC[lang];if(v)u.voice=v;
    const natural=v&&/natural|neural|premium|enhanced|google/i.test(v.name);
    u.rate=lang==="en"?(natural?.88:.82):(natural?.85:.78);
    u.pitch=Math.min(1.35,(PET_PITCH[S.pet]||1.15)*(natural?.95:1));
    speechSynthesis.speak(u);
  };
  if(keep){go();return}
  // cancel() then speaking instantly causes clipped audio in Chrome; give it a breath
  stopVoice();clearTimeout(speakTimer);speakTimer=setTimeout(go,60);
}

// ---------- Cute sound effects (Web Audio, no files needed) ----------
let AC;
function tone(notes,{type="sine",vol=.18,gap=.09,dur=.18}={}){
  if(S.mute)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    const t0=AC.currentTime;
    notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),tt=t0+i*gap;
      o.type=type;o.frequency.setValueAtTime(f,tt);
      g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(vol,tt+.02);g.gain.exponentialRampToValueAtTime(.001,tt+dur);
      o.connect(g).connect(AC.destination);o.start(tt);o.stop(tt+dur+.05)});
  }catch(e){}
}
const SFX={
  ok:()=>tone([784,988,1319],{type:"triangle"}),
  bad:()=>tone([330,262],{type:"sine",vol:.12,gap:.14,dur:.22}),
  tap:()=>tone([660],{type:"sine",vol:.08,dur:.08}),
  pop:()=>tone([1200,600],{type:"square",vol:.06,gap:.03,dur:.08}),
  win:()=>tone([523,659,784,1047,784,1047],{type:"triangle",gap:.11,dur:.25}),
};
document.addEventListener("pointerdown",e=>{if(e.target.closest(".btn"))SFX.tap()},true);
function cheer(ok){
  const p=document.createElement("div");p.className="pop";p.textContent=ok?pick(["🌟","🎉","💖","👏"]):"🤔";
  document.body.appendChild(p);setTimeout(()=>p.remove(),1000);
  ok?SFX.ok():SFX.bad();
  if(!ok)setTimeout(()=>speak(say("tryAgain")),300);
}
const shake=b=>{b.classList.add("no");setTimeout(()=>b.classList.remove("no"),400)};

// ---------- Start: language + age ----------
function agePick(){
  clearTimers();
  if(!S.lang)S.lang="th";
  app.innerHTML=`<div class="momo">${pet().e}</div>
   <div class="say"><b>${t("learn")}</b></div>${langButtons("bigflags")}
   <div class="say">${t("ageQ")}<br><small>${t("ageSub")}</small></div>
   <div class="grid age" style="grid-template-columns:repeat(2,1fr)">${Object.entries(AGES).map(([a,g])=>
     `<button class="btn ${S.age==a?"on":""}" data-a="${a}"><span class="e">${g.icon}</span><b style="font-size:1.6rem">${t("ageLabel",a)}</b><small style="display:block">${t("kg")[a]}</small></button>`).join("")}</div>`;
  wireLangs(agePick);
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{S.age=+b.dataset.a;save();speak(say("age")(S.age));petPick()});
}

// ---------- Buddy picker ----------
function petPick(){
  clearTimers();
  let sel=S.pet||"momo";
  const draw=()=>{const p=PETS.find(x=>x.id===sel), nm=p.n[L_()];
    app.innerHTML=`<div class="momo" style="font-size:6rem">${p.e}</div>
     <div class="say"><b>${nm}</b><br><small>${t("pickBuddy")}</small></div>
     <div class="grid pets" style="grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px">${PETS.map(x=>
       `<button class="btn ${x.id===sel?"on":""}" data-p="${x.id}" style="font-size:2.6rem;padding:12px 4px">${x.e}<small style="display:block;font-size:.75rem">${x.n[L_()]}</small></button>`).join("")}</div>
     <div class="grid" style="margin-top:18px"><button class="btn" id="go" style="background:var(--green);color:#fff"><span class="e">${p.e}</span>${t("playWith",nm)}</button></div>`;
    app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{sel=b.dataset.p;draw();speak(PETS.find(x=>x.id===sel).say[L_()])});
    $("#go").onclick=()=>{S.pet=sel;save();home()};
  };
  draw();
}

// ---------- Home / level map ----------
const levelKey=i=>`${S.age}-${i}`;
const unlocked=i=>i===0||S.done[levelKey(i-1)];
function diff(L){const d={...AGES[S.age]};if(L.hard){d.n=Math.min(6,d.n+1);d.speed*=.8;d.seq=Math.min(5,d.seq+1);d.cnt=Math.min(10,d.cnt+2);d.pairs=Math.min(6,d.pairs+1);d.pat=d.pat==="AB"?"AAB":"ABC"}return d}
function home(){
  clearTimers();
  if(!S.age||!S.lang)return agePick();
  if(!S.pet)return petPick();
  const path=PATHS[S.age], g=AGES[S.age], cleared=path.filter((_,i)=>S.done[levelKey(i)]).length;
  app.innerHTML=`
    <div class="momo" id="pet">${pet().e}${S.hat}</div><div class="say">${pet().hi[L_()]}</div>
    ${langButtons()}
    <div class="row">
      <button class="btn" id="age">${g.icon} ${t("ageLabel",S.age)} ✏️</button><button class="btn" id="chpet">${pet().e} ${t("changeBuddy")}</button><button class="btn" id="mute">${S.mute?"🔇":"🔊"}</button>
      <button class="btn" id="book">📒 ${t("stickers")}</button><button class="btn" id="par">👪 ${t("parents")}</button>
    </div>
    <div class="say">${t("cleared",cleared,path.length)}</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${path.map((L,i)=>{
      const st=S.done[levelKey(i)]||0, open=unlocked(i);
      return `<button class="btn lvl ${open?"":"locked"}" data-i="${i}" ${st?'style="background:#fff3c4"':""}>
        <span class="n">${i+1}${L.hard?" 🔥":""}</span>
        <span class="e">${open?GAMES[L.game].i:"🔒"}</span>${gameName(L.game)}
        <small>${setName(L.set)} ${"⭐".repeat(st)}</small></button>`}).join("")}
    </div>
    <div class="note">${t("tip")}</div>`;
  wireLangs(home);
  app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(!unlocked(i)){speak(say("locked"));return}
    run(i);
  });
  $("#age").onclick=agePick;$("#chpet").onclick=petPick;$("#book").onclick=book;$("#par").onclick=parentGate;
  $("#mute").onclick=()=>{S.mute=!S.mute;if(S.mute)stopVoice();save();home()};
  $("#pet").onclick=()=>speak(pet().say[L_()]);
}

// ---------- Level runner (shared by every game) ----------
function run(idx){
  clearTimers();
  const L=PATHS[S.age][idx], G=GAMES[L.game], d=diff(L), rounds=G.once?1:d.rounds;
  let r=0, miss=0, busy=false;
  const ctx={L,d,set:V[L.set],
    ok(w){if(busy)return;busy=true;if(w)track(w,1);S.stars++;save();cheer(true);
      later(()=>{busy=false;r++;r>=rounds?finish():step()},1100)},
    bad(w){miss++;if(w)track(w,0);cheer(false)},
    head(sub=""){return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px">
      <button class="btn back" id="back">🏠</button><b>${G.i} ${gameName(L.game)} · ${setName(L.set)}</b>
      <span>${rounds>1?"🟢".repeat(r)+"⚪".repeat(rounds-r):""}</span></div>${sub}`},
    bind(){$("#back").onclick=()=>{stopVoice();home()}},
  };
  const step=()=>{clearTimers();GAME_FN[L.game](ctx)};
  function finish(){
    clearTimers();
    const st=miss===0?3:miss<=2?2:1, k=levelKey(idx);
    S.done[k]=Math.max(S.done[k]||0,st);S.stars+=st;save();
    SFX.win();setTimeout(()=>speak(say("hooray")),700);
    const hasNext=idx+1<PATHS[S.age].length;
    app.innerHTML=`<div class="momo">🎉${pet().e}🎉</div><div class="prompt" style="font-size:3rem">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div>
     <div class="prompt">${t("great",st)}</div>
     <div class="grid"><button class="btn" id="again"><span class="e">🔁</span>${t("again")}</button>
     ${hasNext?`<button class="btn" id="nx" style="background:var(--yellow)"><span class="e">➡️</span>${t("next")}</button>`:""}
     <button class="btn" id="h"><span class="e">🏠</span>${t("home")}</button></div>
     ${hasNext?"":`<div class="say">${t("allLevels",S.age)}</div>`}`;
    $("#again").onclick=()=>run(idx);$("#h").onclick=home;if(hasNext)$("#nx").onclick=()=>run(idx+1);
  }
  step();
}

// helper: render picture choices and wire up answer checking
function choices(ctx,opts,ans,{show=o=>o[0],onRight,onWrong}={}){
  return {html:`<div class="choices ${opts.length===3?"c3":""}">${opts.map((o,i)=>`<button class="btn" data-c="${i}"><span class="e">${show(o)}</span></button>`).join("")}</div>`,
    wire(){app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const o=opts[b.dataset.c];
      if(o===ans){b.classList.add("ok");onRight?onRight(b,o):(b.innerHTML+=`<div>${label(o)}</div>`);ctx.ok(ans)}
      else{shake(b);onWrong?onWrong(o):0;ctx.bad(ans)}})}};
}
const listenBtn=()=>`<div class="prompt"><button class="btn" id="rep">🔊 ${t("listenAgain")}</button></div>`;

const GAME_FN={
  // 1. Listen and tap the picture
  tap(ctx){
    const opts=shuffle(ctx.set).slice(0,ctx.d.n), ans=pick(opts), s=()=>speak(word(ans));
    const c=choices(ctx,opts,ans,{onWrong:()=>later(s,900)});
    app.innerHTML=ctx.head(listenBtn())+c.html;
    ctx.bind();c.wire();s();$("#rep").onclick=s;
  },
  // 2. Match the shadow to the picture
  shadow(ctx){
    const opts=shuffle(ctx.set).slice(0,ctx.d.n), ans=pick(opts);
    const c=choices(ctx,opts,ans,{onRight:(b,o)=>{$("#sh").classList.remove("shadow");b.innerHTML+=`<div>${label(o)}</div>`;speak(word(o))}});
    app.innerHTML=ctx.head(`<div class="say">${t("whoseShadow")}</div><div class="big shadow" id="sh">${ans[0]}</div>`)+c.html;
    ctx.bind();c.wire();speak(say("shadow"));
  },
  // 3. Pop the floating balloon that the buddy names
  pop(ctx){
    const pool=shuffle(ctx.set).slice(0,ctx.d.n+1), ans=pick(pool), s=()=>speak(word(ans));
    app.innerHTML=ctx.head(`<div class="prompt"><button class="btn" id="rep">🔊 ${t("popThe")} … ${S.age<=4?ans[0]:"❓"}</button></div>`)+`<div class="sky" id="sky"></div>`;
    ctx.bind();$("#rep").onclick=s;s();
    const sky=$("#sky");
    const spawn=()=>{
      const w=Math.random()<.4?ans:pick(pool), b=document.createElement("button");
      b.className="balloon";b.textContent=w[0];b.style.left=rnd(4,80)+"%";b.style.animationDuration=ctx.d.speed+"s";
      b.onanimationend=()=>b.remove();
      b.onclick=()=>{if(w===ans){b.style.animation="none";b.style.transform="scale(1.6)";b.textContent="💥";SFX.pop();
          setTimeout(()=>b.remove(),300);speak(word(ans));ctx.ok(ans)}
        else{shake(b);ctx.bad(ans);later(s,800)}};
      sky.appendChild(b);
    };
    spawn();every(spawn,ctx.d.speed*220);
  },
  // 4. Memory match (age 3–4: picture↔picture, 5+: picture↔word)
  memory(ctx){
    const pairs=Math.min(ctx.d.pairs,ctx.set.length), picks=shuffle(ctx.set).slice(0,pairs), words=S.age>=5;
    const cards=shuffle(picks.flatMap(w=>[{w,t:w[0]},{w,t:words?word(w):w[0],txt:words}]));
    let open=[],done=0,lock=false;
    app.innerHTML=ctx.head(`<div class="say">${words?t("matchWords"):t("findSame")}</div>`)+
      `<div class="grid mem" style="grid-template-columns:repeat(${cards.length>8?4:3},1fr)">${cards.map((c,i)=>`<button class="btn hid" data-i="${i}" style="${c.txt?"font-size:1.1rem":""}">${c.t}</button>`).join("")}</div>`;
    ctx.bind();
    app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
      if(lock||!b.classList.contains("hid"))return;
      const c=cards[b.dataset.i];b.classList.remove("hid");speak(word(c.w));open.push([b,c]);
      if(open.length<2)return;
      lock=true;const[[b1,c1],[b2,c2]]=open;
      later(()=>{
        if(c1.w===c2.w){b1.classList.add("ok");b2.classList.add("ok");track(c1.w,1);cheer(true);if(++done===pairs){ctx.ok();return}}
        else{b1.classList.add("hid");b2.classList.add("hid");ctx.bad()}
        open=[];lock=false;},900);
    });
  },
  // 5. Count the objects
  count(ctx){
    const pool=V.numbers.slice(0,ctx.d.cnt), ans=pick(pool), item=pick(["🍎","🐥","⭐","🎈","🚗","🐟","🌸"]);
    const opts=shuffle([ans,...shuffle(pool.filter(x=>x!==ans)).slice(0,Math.min(ctx.d.n,pool.length)-1)]);
    const c=choices(ctx,opts,ans,{onRight:()=>speak(word(ans))});
    app.innerHTML=ctx.head(`<div class="prompt" style="font-size:2.6rem;line-height:1.3">${item.repeat(ans[0])}</div><div class="say">${t("howMany")}</div>`)+c.html;
    ctx.bind();c.wire();speak(say("howMany"));
  },
  // 6. Put N of something in the basket
  basket(ctx){
    const want=pick(ctx.set), n=rnd(1,Math.min(5,ctx.d.cnt));
    const shelf=shuffle([...Array(n+2).fill(want),...shuffle(ctx.set.filter(x=>x!==want)).slice(0,ctx.d.n+1)]);
    const ask=()=>speak(say("basket")(n,want));
    let got=0;
    app.innerHTML=ctx.head(`<div class="prompt"><button class="btn" id="rep">🔊 ${S.age<=4?`${n} × ${want[0]}`:"❓"}</button></div>`)+
      `<div class="grid" style="grid-template-columns:repeat(4,1fr)">${shelf.map((f,i)=>`<button class="btn" data-i="${i}" style="font-size:2.5rem;padding:10px">${f[0]}</button>`).join("")}</div>
       <div class="prompt" style="font-size:3rem;min-height:4rem">🧺 <span id="bk"></span></div>`;
    ctx.bind();ask();$("#rep").onclick=ask;
    app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
      if(got>=n)return;const f=shelf[b.dataset.i];
      if(f!==want){shake(b);speak(word(f));ctx.bad(want);return}
      b.style.visibility="hidden";got++;$("#bk").textContent+=f[0];speak(word(V.numbers[got-1]));
      if(got===n)later(()=>ctx.ok(want),600);
    });
  },
  // 7. Odd one out
  odd(ctx){
    const others=Object.keys(V).filter(k=>k!==ctx.L.set&&k!=="numbers");
    const same=shuffle(ctx.set).slice(0,ctx.d.n), ans=pick(V[pick(others)]), opts=shuffle([...same,ans]);
    const c=choices(ctx,opts,ans,{onRight:(b,o)=>{b.innerHTML+=`<div>${label(o)}</div>`;speak(word(o))}});
    app.innerHTML=ctx.head(`<div class="say">${t("odd",setName(ctx.L.set))}</div>`)+c.html;
    ctx.bind();c.wire();speak(say("odd"));
  },
  // 8. What comes next in the pattern?
  pattern(ctx){
    const items=shuffle(ctx.set).slice(0,new Set(ctx.d.pat).size);
    const unit=[...ctx.d.pat].map(ch=>items[ch.charCodeAt(0)-65]);
    const seq=[...unit,...unit,...unit].slice(0,unit.length*2+rnd(0,unit.length-1)), ans=unit[seq.length%unit.length];
    const opts=shuffle([...new Set([ans,...shuffle(ctx.set)])]).slice(0,ctx.d.n);if(!opts.includes(ans))opts[0]=ans;
    const c=choices(ctx,shuffle(opts),ans,{onRight:(b,o)=>{$("#q").textContent=o[0];speak(word(o))}});
    app.innerHTML=ctx.head(`<div class="say">${t("whatNext")}</div>
      <div class="seq">${seq.map(s=>`<span>${s[0]}</span>`).join("")}<span id="q">❓</span></div>`)+c.html;
    ctx.bind();c.wire();speak(say("next"));
  },
  // 9. Reading: first letter (EN) / pick the right word (ZH characters, Thai script)
  letter(ctx){
    const ans=pick(ctx.set);
    if(S.lang!=="en"){
      const opts=shuffle([ans,...shuffle(ctx.set.filter(x=>x!==ans)).slice(0,ctx.d.n-1)]);
      const c=choices(ctx,opts,ans,{show:o=>`<span class="word">${word(o)}</span>`,
        onRight:(b,o)=>{if(S.lang==="zh")b.innerHTML+=`<small>${o[3]}</small>`;speak(word(o))}});
      app.innerHTML=ctx.head(`<div class="say">${t("whichWord")}</div><div class="big">${ans[0]}</div>`)+c.html;
      ctx.bind();c.wire();speak(word(ans));return;
    }
    const first=ans[1][0], abc="abcdefghijklmnoprstuvwy".split("").filter(x=>x!==first);
    const letters=shuffle([first,...shuffle(abc).slice(0,ctx.d.n-1)]).map(x=>[x.toUpperCase()+x]), right=letters.find(l=>l[0][1]===first);
    const c=choices(ctx,letters,right,{onRight:()=>{$("#w").textContent=ans[1];speak(say("letter")(ans))}});
    app.innerHTML=ctx.head(`<div class="say">${t("startsWith",ans[1])}</div><div class="big">${ans[0]}</div>
      <div class="prompt" id="w" style="letter-spacing:4px">_${ans[1].slice(1)}</div>`)+c.html;
    ctx.bind();c.wire();speak(ans[1]);
  },
  // 10. Remember the order (parrot game)
  seq(ctx){
    const len=ctx.d.seq, list=Array.from({length:len},()=>pick(ctx.set)), opts=shuffle([...new Set([...list,...shuffle(ctx.set)])]).slice(0,Math.max(ctx.d.n,new Set(list).size));
    if(!list.every(w=>opts.includes(w)))list.forEach((w,i)=>{if(!opts.includes(w))opts[i]=w});
    let pos=0;
    const play=()=>{stopVoice();list.forEach(w=>speak(word(w),L_(),1))};
    app.innerHTML=ctx.head(`<div class="say">${t("listenOrder",petName(),len)}</div>
      ${listenBtn()}<div class="seq" id="got">${"⬜".repeat(len)}</div>`)+
      `<div class="choices ${opts.length===3?"c3":""}">${opts.map((o,i)=>`<button class="btn" data-c="${i}"><span class="e">${o[0]}</span></button>`).join("")}</div>`;
    ctx.bind();$("#rep").onclick=()=>{pos=0;$("#got").textContent="⬜".repeat(len);play()};later(play,300);
    app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
      const o=opts[b.dataset.c];
      if(o===list[pos]){pos++;$("#got").textContent=list.slice(0,pos).map(w=>w[0]).join("")+"⬜".repeat(len-pos);speak(word(o));
        if(pos===len)ctx.ok(list[0])}
      else{shake(b);ctx.bad(list[pos]);pos=0;later(()=>{$("#got").textContent="⬜".repeat(len);play()},900)}
    });
  },
  // 11. Picture addition
  add(ctx){
    const max=ctx.L.hard?10:6, a=rnd(1,max-1), b=rnd(1,max-a), ans=V.numbers[a+b-1], it=pick(["🍎","🍓","🐤","🌟","🍪"]);
    const opts=shuffle([ans,...shuffle(V.numbers.filter(x=>x!==ans&&Math.abs(x[0]-ans[0])<=3)).slice(0,ctx.d.n-1)]);
    const c=choices(ctx,opts,ans,{onRight:()=>speak(say("sum")(a,b))});
    app.innerHTML=ctx.head(`<div class="prompt" style="font-size:2.2rem;line-height:1.4">${it.repeat(a)} ➕ ${it.repeat(b)}</div><div class="prompt">${a} + ${b} = ❓</div>`)+c.html;
    ctx.bind();c.wire();speak(say("plus")(a,b));
  },
  // 12. Say the word out loud (speech recognition)
  talk(ctx){
    const w=pick(ctx.set), SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    app.innerHTML=ctx.head(`<div class="big">${w[0]}</div><div class="prompt">${label(w)}</div>
      <div class="grid"><button class="btn" id="rep"><span class="e">🔊</span>${t("listen")}</button>
      <button class="btn" id="mic" style="background:var(--yellow)"><span class="e">🎤</span>${SR?t("pressSpeak"):t("sayThenTap")}</button></div><div class="say" id="heard"></div>`);
    ctx.bind();const s=()=>speak(word(w));s();$("#rep").onclick=s;
    $("#mic").onclick=()=>{
      if(!SR){ctx.ok(w);return}   // no recognition: grown-up confirms
      const r=new SR();r.lang=LC[L_()];r.maxAlternatives=5;$("#heard").textContent=t("listening");
      r.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript.toLowerCase().replace(/\s/g,"")), tg=word(w).toLowerCase().replace(/\s/g,"");
        // kids' pronunciation is fuzzy: accept any alternative containing the word
        if(alts.some(a=>a.includes(tg)||(tg.includes(a)&&a.length>1)))ctx.ok(w);
        else{$("#heard").textContent=t("heard",alts[0]);ctx.bad(w)}};
      r.onerror=()=>{$("#heard").innerHTML=`${t("micFail")} <button class="btn" id="skip">${t("saidIt")}</button>`;$("#skip").onclick=()=>ctx.ok(w)};
      r.start();
    };
  },
};

// ---------- Sticker book ----------
function book(){
  const free=S.stars-S.spent;
  app.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><button class="btn back" id="back">🏠</button><b>${t("bookTitle")}</b><span>⭐ ${free}</span></div>
    <div class="say">${t("bookSub",PRICE,petName())}</div>
    <div class="grid" style="grid-template-columns:repeat(5,1fr)">${STICKERS.map(s=>{const has=S.stickers.includes(s);
      return `<button class="btn ${has?"":"locked"} ${S.hat===s?"on":""}" data-s="${s}" style="font-size:2.3rem;padding:10px">${has?s:"❔"}</button>`}).join("")}</div>
    <div class="grid" style="margin-top:16px"><button class="btn" id="buy" style="background:var(--yellow)"><span class="e">🎁</span>${t("buy",PRICE)}</button></div>`;
  $("#back").onclick=home;
  $("#buy").onclick=()=>{const left=STICKERS.filter(s=>!S.stickers.includes(s));
    if(!left.length){speak(say("allDone"));return}
    if(free<PRICE){speak(say("needStars"));return}
    const s=pick(left);S.spent+=PRICE;S.stickers.push(s);save();
    const p=document.createElement("div");p.className="pop";p.textContent=s;document.body.appendChild(p);setTimeout(()=>p.remove(),1000);
    speak(say("yay"));book();};
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{if(S.stickers.includes(b.dataset.s)){S.hat=S.hat===b.dataset.s?"":b.dataset.s;save();book()}});
}

// ---------- Parent page (grown-up gate) ----------
function parentGate(){
  const a=rnd(3,8),b=rnd(4,8),opts=shuffle([a+b,a+b+2,a+b-1]);
  app.innerHTML=`<button class="btn back" id="back">🏠</button><div class="prompt">${t("gate")}: ${a} + ${b} = ?</div>
    <div class="choices c3">${opts.map(o=>`<button class="btn" data-o="${o}"><span class="e">${o}</span></button>`).join("")}</div>`;
  $("#back").onclick=home;app.querySelectorAll("[data-o]").forEach(x=>x.onclick=()=>x.dataset.o==a+b?parentPage():home());
}
function parentPage(){
  const rows=allWords().filter(w=>S.stats[w[1]]).map(w=>({w,...S.stats[w[1]]}));
  const learned=rows.filter(r=>r.ok>=3&&r.ok>r.bad*2), hard=rows.filter(r=>r.bad>=2&&!learned.includes(r)).sort((a,b)=>b.bad-a.bad);
  const chip=r=>`<span class="btn" style="display:inline-block;padding:8px 12px;margin:4px;font-size:1rem">${r.w[0]} ${r.w[1]} · ${r.w[2]} · ${r.w[4]} <small>✔${r.ok} ✘${r.bad}</small></span>`;
  const prog=Object.keys(AGES).map(a=>`${AGES[a].icon} ${t("ageLabel",a)}: <b>${PATHS[a].filter((_,i)=>S.done[`${a}-${i}`]).length}/${PATHS[a].length}</b>`).join(" · ");
  app.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><button class="btn back" id="back">🏠</button><b>${t("report")}</b><span></span></div>
    <p>${t("totals",S.stars,S.stickers.length,STICKERS.length,rows.length,allWords().length)}</p>
    <p>${t("levelsPassed")} — ${prog}</p>
    <h3>${t("known")} (${learned.length})</h3><div>${learned.map(chip).join("")||`<i>${t("noneKnown")}</i>`}</div>
    <h3>${t("practise")} (${hard.length})</h3><div>${hard.map(chip).join("")||`<i>${t("noneHard")}</i>`}</div>
    <p class="note">${t("parentTip")}</p>
    <button class="btn" id="reset" style="font-size:.9rem">${t("reset")}</button>`;
  $("#back").onclick=home;
  $("#reset").onclick=()=>{if(confirm(t("confirmReset"))){Object.assign(S,{stars:0,spent:0,stickers:[],stats:{},done:{},hat:"",age:0,pet:""});save();home()}};
}

save();home();
if(window.speechSynthesis)speechSynthesis.getVoices();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js");
</script>
